data:
  data_root: data/Penn_Action
  schema: metadata/penn_action_schema.json
  val_ids: splits/val_ids.txt
  frames: 32
  normalization: visible_clip
  hidden_policy: interpolate
  debug_per_class: 0
  synthetic: false
model:
  name: transformer
  input_mode: coords_vis_mask
  hidden_size: 64
  num_layers: 3
  num_heads: 4
  dropout: 0.1
train:
  seed: 42
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  scheduler: cosine
  objective: pretrain
  mask_ratio: 0.3
  mask_policy: visible
  workers: 0
  device: auto
  output_dir: outputs/mva_pretrain
