data:
  data_root: data/Penn_Action
  schema: metadata/penn_action_schema.json
  val_ids: splits/val_ids.txt
  frames: 32
  normalization: visible_clip
  hidden_policy: interpolate
  debug_per_class: 0
  synthetic: false
model:
  name: tcn
  input_mode: coords_only
  hidden_size: 64
  num_layers: 3
  kernel_size: 5
  dropout: 0.1
train:
  seed: 42
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  scheduler: cosine
  workers: 0
  device: auto
  output_dir: outputs/mb0_tcn
